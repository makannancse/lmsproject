<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CitiMED CORE | Patient</title>
  <link rel="stylesheet" href="./assets/css/ehr-dashboard.css" />
	<link rel="stylesheet" href="./assets/css/patient.css" />
</head>

<body>
  <div class="app sidebar-collapsed" id="appShell">
  <div id="menu-left-shell"></div>

    <header class="header">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle menu">
        <span class="menu-toggle-lines"><span></span><span></span><span></span></span>
      </button>

      <div class="dashboard-title">
        <h1>Patient Chart</h1>
      </div>

      <div class="top-actions">
        <button class="cta" type="button" onclick="location.href='scheduling-dashboard.html'">Back to Dashboard</button>
      </div>
    </header>

    <main>
      <div class="patient-page">
        <section class="panel patient-header-card">
          <div class="patient-identity">
            <div class="patient-photo-wrap">
              <img id="patientPhoto" class="patient-photo" src="" alt="Patient photo" />
              <div class="patient-avatar-large" id="patientInitials">--</div>
            </div>
            <div class="patient-heading">
              <h1 id="patientName">Loading patient...</h1>
              <p id="patientSummary">Patient #<span id="patientIdLabel"></span></p>
            </div>
          </div>

          <div class="patient-actions">
            <button class="ghost-btn" type="button" id="refreshPatientBtn">Refresh</button>
            <button class="ghost-btn" type="button" id="printPatientBtn">Print</button>
          </div>
        </section>
		
		<section class="panel patient-summary-card">
		  <div class="section-head">
			<div>
			  <h2 class="section-title">Patient Summary</h2>
			  <div class="section-sub">High-level case, therapy, and financial overview.</div>
			</div>
		  </div>

		  <div class="patient-summary-grid" id="patientSummaryGrid"></div>
		</section>
		

        <section class="patient-alert-dashboard" aria-label="Patient dashboard alerts">
          <article class="patient-alert-card" id="alertChiroFollowUp">
            <div class="patient-alert-icon warning">!</div>
            <div>
              <div class="patient-alert-title">Chiro Follow Up</div>
              <div class="patient-alert-value" id="chiroFollowUpValue">Checking...</div>
            </div>
          </article>

          <article class="patient-alert-card" id="alertLegalRepresentation">
            <div class="patient-alert-icon info">L</div>
            <div>
              <div class="patient-alert-title">Legal Representation</div>
              <div class="patient-alert-value" id="legalRepresentationValue">Checking...</div>
            </div>
          </article>

          <article class="patient-alert-card" id="alertMissingEmc">
            <div class="patient-alert-icon danger">E</div>
            <div>
              <div class="patient-alert-title">EMC</div>
              <div class="patient-alert-value" id="missingEmcValue">Checking...</div>
            </div>
          </article>

          <article class="patient-alert-card" id="alertNoMri">
            <div class="patient-alert-icon warning">MRI</div>
            <div>
              <div class="patient-alert-title">MRI</div>
              <div class="patient-alert-value" id="noMriValue">Checking...</div>
            </div>
          </article>

          <article class="patient-alert-card" id="alertMissedTherapy">
            <div class="patient-alert-icon danger">PT</div>
            <div>
              <div class="patient-alert-title">Therapy</div>
              <div class="patient-alert-value" id="missedTherapyValue">Checking...</div>
            </div>
          </article>

          <article class="patient-alert-card" id="alertSurgicalRecommendation">
            <div class="patient-alert-icon warning">S</div>
            <div>
              <div class="patient-alert-title">Surgical Recommendation</div>
              <div class="patient-alert-value" id="surgicalRecommendationValue">Checking...</div>
            </div>
          </article>
        </section>

		
		
<!--		
        <nav class="patient-tabs" aria-label="Patient sections">
          <button class="patient-tab-btn active" type="button" data-section="general">General Info</button>
          <button class="patient-tab-btn" type="button" data-section="address">Address</button>
          <button class="patient-tab-btn" type="button" data-section="case">Case</button>
          <button class="patient-tab-btn" type="button" data-section="schedule">Schedule</button>
          <button class="patient-tab-btn" type="button" data-section="ehr">EHR</button>
          <button class="patient-tab-btn" type="button" data-section="note">Note</button>
          <button class="patient-tab-btn" type="button" data-section="ledger">Ledger</button>
        </nav>

        <section id="section-general" class="panel patient-section active">
          <div class="section-grid">
            <article class="info-card">
              <h2 class="info-title">Demographics</h2>
              <div class="info-list" id="generalDemographics"></div>
            </article>

            <article class="info-card">
              <h2 class="info-title">Contact Info</h2>
              <div class="info-list" id="generalContact"></div>
            </article>
          </div>
        </section>

        <section id="section-address" class="panel patient-section">
          <div class="section-grid">
            <article class="info-card">
              <h2 class="info-title">Home Address</h2>
              <div class="info-list" id="homeAddress"></div>
            </article>

            <article class="info-card">
              <h2 class="info-title">Work Address</h2>
              <div class="info-list" id="workAddress"></div>
            </article>

            <article class="info-card">
              <h2 class="info-title">Pickup Location</h2>
              <div class="info-list" id="pickupAddress"></div>
            </article>

            <article class="info-card">
              <h2 class="info-title">Drop-off Location</h2>
              <div class="info-list" id="dropoffAddress"></div>
            </article>
          </div>
        </section>

        <section id="section-case" class="panel patient-section">
          <div class="section-grid">
            <article class="info-card">
              <h2 class="info-title">Case Details</h2>
              <div class="info-list" id="caseDetails"></div>
            </article>

            <article class="info-card">
              <h2 class="info-title">Attorney</h2>
              <div class="info-list" id="attorneyDetails"></div>
            </article>

            <article class="info-card full">
              <h2 class="info-title">Guarantor / Claim Information</h2>
              <div class="info-list" id="claimDetails"></div>
            </article>
          </div>
        </section>

        <section id="section-schedule" class="panel patient-section">
          <div class="section-head">
            <div>
              <h2 class="section-title">Schedule</h2>
              <div class="section-sub">Appointments for this patient.</div>
            </div>
          </div>

          <div class="patient-table-wrap">
            <table class="patient-detail-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Time</th>
                  <th>Facility</th>
                  <th>Provider</th>
                  <th>Service</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="scheduleRows"></tbody>
            </table>
          </div>
        </section>

        <section id="section-ehr" class="panel patient-section">
          <div class="section-head">
            <div>
              <h2 class="section-title">EHR</h2>
              <div class="section-sub">Medical records, documents, imaging, and clinical history.</div>
            </div>
          </div>

          <div class="section-grid">
            <article class="info-card">
              <h2 class="info-title">Clinical Records</h2>
              <div id="ehrRecords" class="empty-state">EHR record links will load here.</div>
            </article>

            <article class="info-card">
              <h2 class="info-title">Imaging</h2>
              <div id="ehrImaging" class="empty-state">MRI / imaging links will load here.</div>
            </article>
          </div>
        </section>

        <section id="section-note" class="panel patient-section">
          <div class="section-head">
            <div>
              <h2 class="section-title">Internal Notes</h2>
              <div class="section-sub">Staff-only communication.</div>
            </div>
          </div>

          <div class="note-compose">
            <textarea id="newNoteText" placeholder="Add an internal note..."></textarea>
            <button class="ghost-btn" type="button" id="saveNoteBtn">Save Note</button>
          </div>

          <div id="notesList"></div>
        </section>

        <section id="section-ledger" class="panel patient-section">
          <div class="section-head">
            <div>
              <h2 class="section-title">Ledger</h2>
              <div class="section-sub">Charges, payments, adjustments, and balances.</div>
            </div>
          </div>

          <div class="patient-table-wrap">
            <table class="patient-detail-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Description</th>
                  <th>Charge</th>
                  <th>Payment</th>
                  <th>Balance</th>
                </tr>
              </thead>
              <tbody id="ledgerRows"></tbody>
            </table>
          </div>
        </section>
-->		
		
		
		
		
      </div>
    </main>
  </div>

</body>
</html>
