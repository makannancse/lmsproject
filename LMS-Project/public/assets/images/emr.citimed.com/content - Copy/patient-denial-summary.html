<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CitiMED CORE | Document Denial Summary</title>
  <link rel="stylesheet" href="./assets/css/ehr-dashboard.css" />
  <link rel="stylesheet" href="./assets/css/patient-denial-summary.css" />
</head>
<body>
  <div class="app sidebar-collapsed" id="appShell">
  <div id="menu-left-shell"></div>

    <header class="header">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle menu">
        <span class="menu-toggle-lines"><span></span><span></span><span></span></span>
      </button>

      <div class="dashboard-title">
        <h1>Document Denial Summary</h1>
      </div>

      <div class="top-actions">
        <button class="cta" type="button" id="backToPatientBtn">Back to Patient</button>
      </div>
    </header>

    <main>
      <div class="document-page">
        <section class="panel document-summary-card">
          <div class="section-head">
            <div>
              <h2 class="section-title">EOB Review</h2>
              <div class="section-sub" id="patientLabel">Loading patient documents...</div>
            </div>
            <button class="ghost-btn" type="button" id="refreshBtn">Refresh Summary</button>
          </div>

          <div id="statusArea" class="document-note">Analyzing patient documents...</div>
          <div id="summaryGrid" class="document-grid"></div>
        </section>

        <section class="panel document-summary-card">
          <div class="section-head">
            <div>
              <h2 class="section-title">Documents Reviewed</h2>
              <div class="section-sub">PDFs pulled from document_url_path.</div>
            </div>
          </div>
          <div id="documentList" class="document-list"></div>
        </section>
      </div>
    </main>
  </div>

<script src="./assets/js/core-api.js?v=20260430"></script>
<script src="./assets/js/menu-left.js?v=20260430"></script>
<!-- <script src="https://emr.citimed.com/new-ui/js/core.js?v=20260430"></script> -->

<script>
	document.addEventListener('DOMContentLoaded', async function () {
		// VALIDATE PAGE
		let url = `https://emr.citimed.com/rest/login/validate-page.php`;
		res = await getPHPValue(url);
		if (!res.ok) document.location.assign(`http:\\emr.citimed.com`);		
	});
</script>
<script src="./assets/js/patient-denial-summary.js?v=20260430"></script>
  
</body>
</html>
