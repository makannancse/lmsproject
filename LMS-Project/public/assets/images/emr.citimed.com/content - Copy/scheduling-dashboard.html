<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITIMED EHR Scheduling Dashboard</title>
<link rel="stylesheet" href="./assets/css/ehr-dashboard.css?v=20260428">
</head>
<body>
<div class="app sidebar-collapsed" id="appShell">
  <div id="menu-left-shell"></div>
  <header class="header">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" type="button">
	<span class="menu-toggle-lines"><span></span><span></span><span></span></span>
	</button>
	
<div class="dashboard-title">
	  <img src="../content/assets/core_logo.svg?v=20260430" alt="CITIMED Logo" class="dashboard-logo">
</div>
    <div class="search">
	<span class="mini-icon" id="searchIcon"></span>
		<input id="patientSearchInput" type="text" placeholder="Search patient, by ID, name, DOB">
		<div class="patient-search-row">
				<button id="patientSearchBtn" type="button" class="ghost-btn">Search</button>
		</div>
	</div>
		<div class="top-actions">
			<button class="icon-badge" type="button">
				<span id="usersIcon"></span>
				<span class="notif" id="facilityCount">0</span>
			</button>
			<button class="cta">+ New</button>
			<button id="aiAssistantBtn" class="ghost-btn clara-btn">
					  <span class="clara-avatar">
						<svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
						  <rect width="42" height="42" rx="14" fill="url(#claraGradient)"/>

						  <!-- subtle medical cross -->
						  <path d="M20 10H22V18H30V20H22V28H20V20H12V18H20V10Z"
								fill="white" opacity="0.18"/>

						  <!-- assistant face -->
						  <circle cx="16" cy="23" r="2" fill="white"/>
						  <circle cx="26" cy="23" r="2" fill="white"/>

						  <path d="M16 30C18.8 32.2 23.2 32.2 26 30"
								stroke="white"
								stroke-width="2"
								stroke-linecap="round"/>

						  <!-- AI sparkle -->
						  <path d="M30.5 9L31.6 11.4L34 12.5L31.6 13.6L30.5 16L29.4 13.6L27 12.5L29.4 11.4L30.5 9Z"
								fill="white"/>

						  <defs>
							<linearGradient id="claraGradient" x1="6" y1="4" x2="36" y2="38" gradientUnits="userSpaceOnUse">
							  <stop stop-color="#18B9C8"/>
							  <stop offset="1" stop-color="#0D728A"/>
							</linearGradient>
						  </defs>
						</svg>
					  </span>
					  Ask CLARA
					</button>
		</div>
  </header>
  
  <main>
			  
		<div class="patient-search-card">
			  <div id="patientSearchResults" class="patient-search-results"></div>
		</div>
  
  
    <div class="page-head">
	   <div class="dashboard-subtitle">
		<h2>Scheduling Dashboard</h2>
	  </div>
	  
      <div class="patient-search is-hidden" id="filtersPanel">
        <select class="filter-select" id="locationFilter"></select>
        <select class="filter-select" id="providerFilter"></select>
        <select class="filter-select" id="serviceGroupSelect"></select>
        <div class="service-selector" id="serviceSelector">
          <button class="filter service-toggle" id="serviceToggleBtn" type="button">Select individual services ▾</button>
          <div class="service-selector-body" id="serviceSelectorBody"></div>
        </div>
        <div class="status-selector" id="statusSelector">
          <button class="filter status-toggle" id="statusToggleBtn" type="button">Appointment Status ▾</button>
          <div class="status-selector-body">
		  <label class="service-help"><input type="checkbox" id="allStatusCheckbox"> All Status</label>
		  <select class="filter-select filter-multiselect" id="statusMultiSelect" multiple></select>
		  </div>
        </div>
        <button class="filter" id="applyFilters" type="button">Apply Filters</button>
      </div>
	  
	  <button type="button" id="toggleFiltersBtn" class="filter">
            Show Filters
       </button>
	  
    </div>

    <section class="panel stats" id="statsPanel"></section>

    <section class="panel alert-panel">
      <div class="section-head"><div><h2 class="section-title">Today's tasks</h2><div class="section-sub" id="taskDateLabel"></div></div></div>
      <div class="alerts-grid" id="alertsGrid"></div>
    </section>

    <div style="height:16px"></div>
	<section class="panel alert-panel is-hidden" id="missingEmcPanel"></section>
    <div style="height:16px"></div>
	<section class="panel alert-panel is-hidden" id="missingPipPanel"></section>	
	<div style="height:16px"></div>
	<section class="panel alert-panel is-hidden" id="missingFollowUpPanel"></section>
    <div style="height:16px"></div>
	<section class="panel alert-panel is-hidden" id="missingAttorneyPanel"></section>
    
	
	<div style="height:22px"></div>
    <section class="panel schedule-panel">
      <div class="schedule-toolbar">
        <div class="toolbar-left">
          <div>	
			<h2 class="section-title" style="margin-bottom:8px;">Upcoming Appointments</h2>
			<div class="section-sub">Live schedule grouped by facility, date, and time block.</div>
		  </div>
          <div class="schedule-subtools">
            <div class="single-calendar-wrap">
              <button class="date-picker date-range-display" id="dateRangeButton" type="button"></button>
              <div class="calendar-popover is-hidden" id="calendarPopover">
                <div class="calendar-head"><button class="calendar-nav" id="calendarPrev" type="button">‹</button><div class="calendar-title" id="calendarTitle"></div><button class="calendar-nav" id="calendarNext" type="button">›</button></div>
                <div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="calendar-actions"><button class="filter" id="calendarToday" type="button">Today</button><button class="filter" id="calendarRangeMode" type="button">Select Range</button><button class="filter" id="calendarApply" type="button">Apply</button></div>
              </div>
            </div>
            <button class="filter quick-range" type="button" data-range-days="90">Last 3 Months</button>
            <div class="view-switcher">
				<button class="view-btn active" type="button" data-view="day">Day</button>
				<button class="view-btn" type="button" data-view="week">Week</button>
				<button class="view-btn" type="button" data-view="month">Month</button>
			</div>
            <div class="week-nav" id="weekNav">
			<button class="week-arrow" id="prevWeekBtn" type="button">‹</button>
			<span class="week-nav-label" id="weekNavLabel"></span>
			<div class="schedule-range-label" id="scheduleRangeLabel"></div>
			<button class="week-arrow" id="nextWeekBtn" type="button">›</button>		
			</div>
            <div class="schedule-range-label" id="scheduleRangeLabel"></div>
          </div>
        </div>
        <div class="toolbar-right"><button class="schedule-toggle-past" id="togglePastBlocks" type="button">View past time blocks</button></div>
      </div>

      <div class="schedule-view active" id="dayView"><div class="appointments-col" id="dayAppointments"></div></div>
      <div class="schedule-view" id="weekView"><div class="week-grid" id="weekGrid"></div></div>
      <div class="schedule-view" id="monthView"><div class="month-grid" id="monthGrid"></div></div>
      <div class="footer-summary" id="footerSummary"></div>
    </section>
	
	
	
	
	
  </main>
</div>
<script src="./assets/js/core-api.js?v=20260430"></script>
<script src="./assets/js/menu-left.js?v=20260430"></script>
<script src="./assets/js/scheduling-dashboard.js?v=20260430"></script>
<script>
document.getElementById('searchIcon').innerHTML = iconSvg('search');
document.getElementById('usersIcon').innerHTML = iconSvg('users');
</script>


<!-- <script src="https://emr.citimed.com/new-ui/js/core.js?v=20260430"></script> -->

<script>
	document.addEventListener('DOMContentLoaded', async function () {
		// VALIDATE PAGE
		let url = `https://emr.citimed.com/rest/login/validate-page.php`;
		res = await getPHPValue(url);
		if (!res.ok) document.location.assign(`http:\\emr.citimed.com`);		
	});
</script>


</body>
</html>
