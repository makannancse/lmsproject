<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CitiMED CORE | Client EHR</title>

  <link rel="stylesheet" href="./assets/css/ehr-dashboard.css" />
  <link rel="stylesheet" href="./assets/css/client-ehr.css" />
</head>

<body>
  <div class="app sidebar-collapsed" id="appShell">
    <div id="menu-left-shell"></div>

    <header class="header">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle menu">
        <span class="menu-toggle-lines">
          <span></span><span></span><span></span>
        </span>
      </button>

      <div class="dashboard-title">
        <h1>Client EHR</h1>
      </div>

      <div class="top-actions">
        <button class="ghost-btn" type="button" id="backToClientBtn">Back to Client</button>
        <button class="ghost-btn" type="button" id="refreshEhrBtn">Refresh</button>
      </div>
    </header>

    <main>
      <div class="client-ehr-page">

        <section class="panel ehr-header-card">
          <div>
            <h2 class="section-title">Medical Reports</h2>
            <div class="section-sub" id="ehrSub">Loading documents...</div>
          </div>

          <div class="ehr-search">
            <input id="ehrSearchInput" type="search" placeholder="Search doctor, service, report type..." />
          </div>
        </section>

        <section class="ehr-summary">
          <article class="ehr-kpi">
            <div class="ehr-kpi-label">Documents</div>
            <div class="ehr-kpi-value" id="kpiDocuments">0</div>
          </article>

          <article class="ehr-kpi">
            <div class="ehr-kpi-label">Doctors</div>
            <div class="ehr-kpi-value" id="kpiDoctors">0</div>
          </article>

          <article class="ehr-kpi">
            <div class="ehr-kpi-label">Services</div>
            <div class="ehr-kpi-value" id="kpiServices">0</div>
          </article>
        </section>

        <section class="panel ehr-results-panel">
          <div class="section-head">
            <div>
              <h2 class="section-title">Reports</h2>
              <div class="section-sub">Click a document to open it.</div>
            </div>
          </div>

          <div class="ehr-results-header">
            <button type="button" data-sort-key="appointment_date">Appointment</button>
            <button type="button" data-sort-key="doctor_full_name">Doctor</button>
            <button type="button" data-sort-key="service_desc">Service</button>
            <button type="button" data-sort-key="document_type_desc">Document Type</button>
            <button type="button" data-sort-key="generated_dtm">Generated</button>
            <button type="button" data-sort-key="appointment_status_desc">Status</button>
          </div>

          <div class="ehr-doc-list" id="ehrDocRows">
            <div class="empty-state">Loading documents...</div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="./assets/js/core-api.js?v=20260505"></script>
  <script src="./assets/js/menu-left.js?v=20260505"></script>
  <!-- <script src="https://emr.citimed.com/new-ui/js/core.js?v=20260505"></script> -->

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      let url = `https://emr.citimed.com/rest/login/validate-page.php`;
      res = await getPHPValue(url);
      if (!res.ok) document.location.assign(`http:\\emr.citimed.com`);
    });
  </script>

  <script src="./assets/js/client-ehr.js?v=20260505"></script>
</body>
</html>
